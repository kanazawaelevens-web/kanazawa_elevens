<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GAME | 11's BASEBALL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a href="index.html">
        <img src="images/logo.png" alt="チームロゴ" class="logo">
    </a>

    <nav>
        <a href="index.html">HOME</a>
        <a href="team.html">TEAM</a>
        <a href="players.html">PLAYERS</a>
        <a href="game.html">GAME</a>
        <a href="reports.html">REPORTS</a>
        <a href="contact.html">CONTACT</a>
    </nav>
</header>

<main>

    <section class="page-hero">
        <p>GAME INFORMATION</p>
        <h1>GAME</h1>
        <span>試合情報・試合結果</span>
    </section>

    <!-- TEAM RECORD -->

    <section class="game-section">

        <p class="section-label">SEASON RECORD</p>
        <h2>TEAM RECORD</h2>

        <div class="record-grid">

            <div class="record-card">
                <span>WIN</span>
                <strong>-</strong>
                <p>勝利</p>
            </div>

            <div class="record-card">
                <span>LOSE</span>
                <strong>-</strong>
                <p>敗北</p>
            </div>

            <div class="record-card">
                <span>DRAW</span>
                <strong>-</strong>
                <p>引き分け</p>
            </div>

            <div class="record-card">
                <span>WIN RATE</span>
                <strong>-.---</strong>
                <p>勝率</p>
            </div>

        </div>

    </section>

    <!-- GAME RESULTS -->

    <section class="game-section dark-section">

        <p class="section-label">LATEST GAMES</p>
        <h2>GAME RESULTS</h2>

        <div class="game-card">

            <div class="game-date">DATE : 2026.XX.XX</div>

            <div class="game-match">
                <div>
                    <span>HOME</span>
                    <h3>11's</h3>
                </div>

                <div class="game-score">
                    <strong>-</strong>
                    <span>VS</span>
                    <strong>-</strong>
                </div>

                <div>
                    <span>AWAY</span>
                    <h3>OPPONENT</h3>
                </div>
            </div>

            <p class="game-status">GAME RESULT</p>

        </div>

    </section>



</main>

</body>
</html>
